name: Health

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  # A failed scheduled run emails whoever last edited this file; /api/health is 503 when a room is down or the disk is full.
  health:
    name: production answers healthy
    if: ${{ vars.STRATA_HEALTH_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /api/health
        env:
          HEALTH_URL: ${{ vars.STRATA_HEALTH_URL }}
        run: curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 15 "$HEALTH_URL"
