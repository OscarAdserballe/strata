<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus</title>
<!-- The dashboard: a separate app Strata hosts at <room>/dashboard. Threads move through Triage (inbox, backlog,
     to-do), Thinking (one doc open at a time) and Review; agents feed the inbox through dashboard_add_items. -->
<script>window.STRATA_BASE = "__STRATA_BASE__";</script>
<style>
:root{
  --bg:#fafaf8; --surface:#ffffff; --sunk:#efeeea; --line:#e6e5e1; --line-strong:#d9d8d3;
  --text:#1a1a1a; --text-2:#3d3d3a; --text-3:#55554f; --muted:#6b6b66; --faint:#9a9a94;
  --accent:#1f55c0; --accent-ink:#ffffff; --accent-deep:#163f91; --accent-wash:#eef3fc;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;position:relative}
button,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent);text-decoration:none} a:hover{color:var(--accent-deep)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--muted)} .faint{color:var(--faint)} .xs{font-size:12px} .sm{font-size:13px}
.spacer{flex:1}
.label{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-3)}

/* one soft sky per mode, low enough that text never fights it */
.sky{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.sky .base{position:absolute;inset:0}
.sky .b{position:absolute;border-radius:50%}
body[data-mode="triage"] .base{background:linear-gradient(180deg,#eeeaf3 0%,#f5f2f6 36%,#fafaf8 72%)}
body[data-mode="triage"] .b1{left:28%;top:-520px;width:1400px;height:900px;background:radial-gradient(ellipse at center,rgba(200,190,225,.45) 0%,rgba(200,190,225,0) 70%)}
body[data-mode="triage"] .b2{left:-300px;top:-200px;width:900px;height:600px;background:radial-gradient(ellipse at center,rgba(250,215,200,.45) 0%,rgba(250,215,200,0) 70%)}
body[data-mode="thinking"] .base{background:linear-gradient(180deg,#fbeee4 0%,#fbf4ee 34%,#fafaf8 70%)}
body[data-mode="thinking"] .b1{left:43%;top:-420px;width:1300px;height:900px;background:radial-gradient(ellipse at center,rgba(255,190,150,.55) 0%,rgba(255,190,150,0) 68%)}
body[data-mode="thinking"] .b2{left:-300px;top:-200px;width:1000px;height:700px;background:radial-gradient(ellipse at center,rgba(215,222,245,.6) 0%,rgba(215,222,245,0) 68%)}
body[data-mode="thinking"] .b3{left:20%;top:60px;width:1100px;height:520px;background:radial-gradient(ellipse at center,rgba(255,226,196,.5) 0%,rgba(255,226,196,0) 70%)}
body[data-mode="review"] .base{background:linear-gradient(180deg,#f8efe0 0%,#faf5ec 36%,#fafaf8 72%)}
body[data-mode="review"] .b1{left:-400px;top:-450px;width:1300px;height:900px;background:radial-gradient(ellipse at center,rgba(246,205,140,.5) 0%,rgba(246,205,140,0) 68%)}
body[data-mode="review"] .b2{left:48%;top:-250px;width:1100px;height:700px;background:radial-gradient(ellipse at center,rgba(232,220,235,.55) 0%,rgba(232,220,235,0) 70%)}

/* top bar */
header.top{height:64px;display:flex;align-items:center;padding:0 32px;gap:24px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;flex:1 1 0;min-width:0}
.brand a{color:var(--text)}
.modes{display:flex;justify-content:center}
.seg{display:flex;gap:2px;padding:3px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.7);border-radius:10px}
.seg .m{min-height:36px;padding:0 18px;border-radius:8px;border:0;background:transparent;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--text-2);position:relative}
.seg .m .n{font-size:12px;color:var(--muted)}
.seg .m[aria-selected="true"]{background:var(--text);color:#fff}
.seg .m[aria-selected="true"] .n{color:#cfcfca}
.seg .m .badge[hidden]{display:none}
.seg .m .badge{position:absolute;top:-5px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.seg .m.over{box-shadow:inset 0 0 0 2px var(--accent)}
.clock{flex:1 1 0;min-width:0;text-align:right;display:flex;flex-direction:column;align-items:flex-end;line-height:1.3}
.clock b{font-weight:600;font-size:14px;white-space:nowrap}
.clock span{font-size:12.5px;color:var(--muted);white-space:nowrap}

main{max-width:1200px;width:100%;margin:0 auto;padding:36px 24px 120px}

.src{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.src i{display:inline-block;flex:none;width:7px;height:7px;border-radius:2px;background:var(--faint)}
.src.linear i{background:#5e6ad2}.src.slack i{background:#e01e5a}.src.you i{background:var(--text)}.src.github i{background:#1a1a1a}.src.agent i{background:#b5b5af;border-radius:50%}.src.notion i{background:#1a1a1a}
a.src:hover{color:var(--text)}
.area-chip{font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--faint)}

.btn{min-height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);font-size:13.5px;display:inline-flex;align-items:center;gap:6px;color:var(--text)}
.btn.primary{min-height:40px;padding:0 18px;background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;font-size:14px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:rgba(0,0,0,.05);color:var(--text)}
.btn.dark{background:var(--text);color:#fff;border-color:var(--text);font-weight:600}
.btn.sm{min-height:30px;padding:0 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.kbd{font:11px ui-monospace,Menlo,monospace;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px;background:var(--surface)}

/* ===== triage ===== */
.triage{display:flex;gap:48px;align-items:flex-start}
.list-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.subbar{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.subbar .st{min-height:32px;padding:0 12px;border-radius:7px;border:0;background:transparent;display:flex;align-items:center;gap:7px;font-size:14px;font-weight:500;color:var(--muted)}
.subbar .st .n{font-size:12px;color:var(--faint)}
.subbar .st[aria-selected="true"]{background:rgba(255,255,255,.85);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.subbar .st[aria-selected="true"] .n{color:var(--muted)}
.subbar .st.over{box-shadow:inset 0 0 0 2px var(--accent)}
.areaseg{display:flex;gap:2px;padding:2px;border-radius:8px;background:rgba(0,0,0,.05)}
.areaseg button{min-height:28px;padding:0 12px;border-radius:6px;border:0;background:transparent;font-size:13px;font-weight:500;color:var(--muted)}
.areaseg button[aria-selected="true"]{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.add{display:flex;gap:8px}
.add input{flex:1;min-width:0;min-height:38px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);padding:0 12px;font-size:14px}
.list{display:flex;flex-direction:column}
.empty{margin:0;padding:18px 0;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
.r{display:flex;align-items:center;gap:12px;min-height:40px;border-top:1px solid var(--line);padding:0 8px;margin:0 -8px;cursor:grab;border-radius:6px}
.r.dragging{opacity:.4}
.r .t{flex:1;min-width:0;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--text)}
.r .t:hover{color:var(--accent)}
.r .d{font-size:12px;color:var(--faint);width:46px;text-align:right}
.r .acts{display:none;gap:2px}
.r:hover .acts,.r:focus-within .acts{display:flex}
.r:hover .d,.r:focus-within .d{display:none}
.r.pick{background:rgba(255,255,255,.7);box-shadow:inset 3px 0 0 var(--accent)}
.r.dim .t{color:var(--text-3);font-weight:400}
.fold{display:flex;gap:8px;align-items:center;min-height:40px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);background:none;border-left:0;border-right:0;border-bottom:0;padding:0;width:100%;text-align:left}
.fold .chev{width:14px;height:14px;border-radius:3px;border:1px solid var(--line-strong);display:inline-flex;align-items:center;justify-content:center;font-size:9px;color:var(--faint)}
.ir{display:flex;flex-direction:column;gap:3px;padding:12px 10px;border-top:1px solid var(--line);margin:0 -10px;cursor:pointer}
.ir[aria-current="true"]{background:rgba(255,255,255,.8);border-radius:8px;border-top-color:transparent}
.ir .t{font-size:14.5px;font-weight:600;line-height:1.35}
.ir .c{font-size:13.5px;color:var(--text-3);line-height:1.45}
.ir .q{font-size:13.5px;color:var(--text-3);line-height:1.45;padding-left:12px;border-left:2px solid var(--line-strong);margin:4px 0 2px}
.ir .k{display:flex;align-items:center;gap:12px;margin-top:4px;flex-wrap:wrap}
.ir .k .acts{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tmrw{flex:0 0 360px;display:flex;flex-direction:column;gap:14px;position:sticky;top:24px}
.tmrw h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px}
.tmrw h1 .n{font-size:14px;font-weight:500;color:var(--muted)}
.tmrw .box{background:rgba(255,255,255,.82);border:1px solid var(--line);border-radius:14px;padding:18px 18px 14px;display:flex;flex-direction:column;gap:6px;outline:2px dashed transparent;outline-offset:4px}
.tmrw .box.over{outline-color:var(--accent)}
.slot{display:flex;flex-direction:column;gap:4px;padding:10px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line);cursor:grab;position:relative}
.slot .t{font-size:14px;font-weight:600;line-height:1.35;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--text)}
.slot .t:hover{color:var(--accent)}
.slot .k{display:flex;gap:10px;align-items:center}
.slot .x{position:absolute;right:4px;top:4px;width:26px;height:26px;border:0;background:transparent;border-radius:6px;color:var(--faint);display:none;align-items:center;justify-content:center}
.slot:hover .x{display:flex} .slot .x:hover{background:var(--sunk);color:var(--text)}
.slot.empty{border-style:dashed;background:transparent;color:var(--faint);font-size:13.5px;align-items:center;justify-content:center;min-height:58px;cursor:default}
.tmrw .hint{font-size:12.5px;color:var(--muted);line-height:1.5;padding:4px 2px 0}
.routine{display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--muted);padding-top:18px}
.routine .rrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.routine input{min-height:34px;padding:0 10px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);font:12.5px ui-monospace,Consolas,monospace}
.routine .err{color:var(--accent-deep);font-weight:500}

/* ===== thinking ===== */
.think{display:flex;gap:48px;align-items:flex-start;max-width:1120px;margin:0 auto}
.rail{flex:0 0 240px;padding-top:12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:24px}
.thread{padding:10px 12px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--text-3);font-size:14px;line-height:1.35;text-align:left;cursor:pointer;width:100%}
.thread:hover{background:rgba(255,255,255,.5)}
.thread.open{background:rgba(255,255,255,.85);border-color:rgba(255,255,255,.9);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.thread.closed{opacity:.55}
.thread.todo{opacity:.45;font-size:13.5px;padding:7px 12px}
.rail .sec{height:1px;background:var(--line);margin:14px 12px 10px}
.rail .none{font-size:13px;color:var(--faint);padding:10px 12px;line-height:1.5}
.doc{flex:1;min-width:0;max-width:760px;background:var(--surface);border:1px solid rgba(255,255,255,.9);border-radius:14px;padding:52px 72px 40px;box-shadow:0 1px 2px rgba(0,0,0,.03),0 16px 40px -20px rgba(120,80,60,.25);min-height:720px;display:flex;flex-direction:column}
.doc .crumb{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--faint);margin-bottom:14px;flex-wrap:wrap}
.doc .crumb .spacer{flex:1}
.dtitle{width:100%;margin:0 0 18px;font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.2;border:0;background:transparent;resize:none;overflow:hidden;padding:0;color:var(--text)}
.dtitle:focus{outline:none}
.dbody{width:100%;flex:1;min-height:420px;border:0;background:transparent;resize:none;padding:0;font-size:15.5px;line-height:1.7;color:#2b2b28;field-sizing:content}
.dbody:focus{outline:none}
.doc:not(.editing) .dbody{position:absolute;opacity:0;pointer-events:none;height:1px}
.doc.editing .preview{display:none}
.preview{flex:1;min-height:420px;cursor:text;font-size:15.5px;line-height:1.7;color:#2b2b28}
.preview .ph{color:var(--faint)}
.preview h4{margin:18px 0 4px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-3)}
.preview p{margin:0 0 12px} .preview ul,.preview ol{margin:0 0 12px;padding-left:22px} .preview li{margin:3px 0}
.preview blockquote{margin:6px 0 12px;padding:2px 0 2px 12px;border-left:2px solid var(--line-strong);color:var(--text-3)}
.preview code{font:13.5px ui-monospace,monospace;background:var(--sunk);padding:1px 4px;border-radius:4px}
.preview pre{margin:8px 0 12px;font:13px/1.5 ui-monospace,monospace;background:var(--sunk);padding:10px 12px;border-radius:6px;overflow-x:auto}
.dbody::placeholder,.dtitle::placeholder{color:var(--faint)}
.doc .foot{margin-top:auto;padding-top:32px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.doc .foot .state{margin-left:auto;font-size:12.5px;color:var(--faint)}
.doc.blank{align-items:center;justify-content:center;color:var(--muted);font-size:15px;text-align:center;line-height:1.6}

/* ===== review ===== */
.review{display:flex;gap:40px;align-items:flex-start}
.rlist{flex:0 0 380px;display:flex;flex-direction:column;gap:14px}
.rlist h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px}
.rlist h1 .n{font-size:14px;font-weight:500;color:var(--muted)}
.rrow{display:flex;flex-direction:column;gap:5px;padding:12px 12px;margin:0 -12px;border-top:1px solid var(--line);border-left:0;border-right:0;border-bottom:0;background:none;text-align:left;width:calc(100% + 24px);cursor:pointer;color:var(--text)}
.rrow[aria-current="true"]{background:rgba(255,255,255,.85);border-radius:6px;border-top-color:transparent;box-shadow:inset 3px 0 0 var(--accent)}
.rrow .t{font-weight:600;font-size:14px;line-height:1.35}
.rrow .k{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.arow{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.arow .at{flex:1;min-width:0;color:var(--text-3)}
.rpanel{flex:1;min-width:0;background:var(--surface);border:1px solid rgba(255,255,255,.9);border-radius:12px;padding:28px 30px;display:flex;flex-direction:column;gap:22px;min-height:460px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.rpanel .from{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.rpanel h2{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.rpanel.blank{align-items:center;justify-content:center;color:var(--muted);font-size:15px}
.arts{display:flex;flex-direction:column;gap:8px}
.art{display:flex;gap:14px;align-items:center;padding:12px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.art .ic{width:34px;height:34px;border-radius:8px;background:var(--sunk);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--text-3);flex:none;text-transform:uppercase}
.art .ic.github{background:#1a1a1a;color:#fff}.art .ic.linear{background:#eceefb;color:#5e6ad2}.art .ic.slack{background:#fbe9ef;color:#e01e5a}.art .ic.web{background:var(--accent-wash);color:var(--accent-deep)}
.art .am{flex:1;min-width:0}
.art .at{font-size:14.5px;font-weight:500;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art .ad{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art .go{font-size:13px;color:var(--accent);white-space:nowrap}
.addlink{display:flex;gap:8px}
.addlink input{flex:1;min-width:0;min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13.5px}
.notes{font-size:14.5px;line-height:1.6;color:var(--text-2);max-width:68ch}
.notes h4{margin:14px 0 4px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-3)}
.notes p{margin:0 0 8px} .notes ul,.notes ol{margin:0 0 8px;padding-left:20px} .notes li{margin:2px 0}
.notes blockquote{margin:6px 0 10px;padding:2px 0 2px 12px;border-left:2px solid var(--line-strong);color:var(--text-3)}
.notes code{font:13px ui-monospace,monospace;background:var(--sunk);padding:1px 4px;border-radius:4px}
.notes pre{margin:8px 0;font:12.5px/1.5 ui-monospace,monospace;background:var(--sunk);padding:8px 10px;border-radius:6px;overflow-x:auto}
details.fold2{border-top:1px solid var(--line);padding-top:8px}
details.fold2 summary{list-style:none;cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-3)}
details.fold2 summary::-webkit-details-marker{display:none}
.ractions{margin-top:auto;padding-top:18px;border-top:1px solid #ecebe7;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ractions .r2{margin-left:auto}

/* sheet: a thread's doc opened from anywhere without moving it */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.2);display:none;z-index:40}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--surface);box-shadow:-4px 0 20px rgba(0,0,0,.15);padding:40px 48px;overflow:auto;display:none;flex-direction:column;z-index:41}
.sheet .doc{border:0;box-shadow:none;padding:0;min-height:0;max-width:none;flex:1}
.sheet-open .sheet-bg{display:block} .sheet-open .sheet{display:flex}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;display:none;max-width:90%;z-index:50}
.toast.show{display:block}
@media (max-width:900px){
  header.top{height:auto;flex-wrap:wrap;padding:12px 16px;gap:10px 16px}
  .clock{align-items:flex-start;text-align:left;flex-basis:100%}
  main{padding:20px 16px 120px}
  .triage,.think,.review{flex-direction:column;gap:28px}
  .tmrw,.rlist,.rail{flex:none;width:100%;position:static}
  .doc{padding:28px 22px}
  .r .acts{display:flex} .r .d{display:none}
  .sheet{padding:24px 18px}
}
</style>
</head>
<body data-mode="triage">
<div class="sky" aria-hidden="true"><div class="base"></div><div class="b b1"></div><div class="b b2"></div><div class="b b3"></div></div>
<header class="top">
  <div class="brand"><a id="strataLink" href="./">Focus</a></div>
  <nav class="modes"><div class="seg" role="tablist" aria-label="Modes">
    <button class="m" role="tab" data-mode="triage" data-drop="triage">Triage<span class="badge" id="triageBadge" hidden></span></button>
    <button class="m" role="tab" data-mode="thinking" data-drop="thinking">Thinking <span class="n" id="thinkN"></span></button>
    <button class="m" role="tab" data-mode="review" data-drop="review">Review <span class="n" id="reviewN"></span></button>
  </div></nav>
  <div class="clock"><b id="clockTime"></b><span id="clockLine"></span></div>
</header>
<main id="view"><p class="muted">Loading…</p></main>
<div class="sheet-bg" id="sheetBg"></div>
<aside class="sheet" id="sheet" aria-label="Thread"></aside>
<div class="toast" id="toast" role="status"></div>

<script>
const BASE = window.STRATA_BASE && window.STRATA_BASE !== "__STRATA_BASE__" ? window.STRATA_BASE : "/";
const MODES = ['triage', 'thinking', 'review'];
const ENDED = (t) => t.stage === 'done' || t.stage === 'dropped';
const MODE_NAME = {triage: 'Triage', thinking: 'Thinking', review: 'Review'};
const STAGE_NAME = {backlog: 'Backlog', todo: 'To-do', thinking: 'Thinking', review: 'Review', done: 'Done', dropped: 'Dropped'};

// Server data, plus what only this tab knows: the mode, which thread is open, edits not yet saved.
const S = {tasks: [], inbox: [], archived: 0, mode: 'triage', sub: 'backlog', area: 'work', open: null, sheet: null, sel: null, cur: null, editing: null,
  unfold: false, doneOpen: false, archive: null, tedits: {}, sig: '', routine: null, routineForm: false, running: false};
let dragId = null, inflight = 0;

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key = () => (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()).replace(/[^A-Za-z0-9-]/g, '').slice(0, 40);
const task = (id) => S.tasks.find((t) => t.id === id);
const storage = { get(k, fb){ try { return JSON.parse(localStorage.getItem(k) || 'null') ?? fb; } catch { return fb; } }, set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const session = { get(k, fb){ try { return JSON.parse(sessionStorage.getItem(k) || 'null') ?? fb; } catch { return fb; } }, set(k, v){ try { sessionStorage.setItem(k, JSON.stringify(v)); } catch {} } };
function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 3000); }
const hm = (t) => new Date(t).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
function age(t){
  const d = Math.max(0, Date.now() - t), h = d / 36e5;
  if (h < 1) return `${Math.max(1, Math.round(d / 6e4))} m`;
  if (h < 24) return `${Math.round(h)} h`;
  if (h < 24 * 14) return `${Math.round(h / 24)} d`;
  return `${Math.round(h / 24 / 7)} w`;
}
const OLD = 14 * 864e5;
const kindOf = (src) => /linear|TRY-|GD-/i.test(src) ? 'linear' : /slack|#/i.test(src) ? 'slack' : /github|PR\b|renovate/i.test(src) ? 'github' : /notion/i.test(src) ? 'notion' : /^you$|added by you/i.test(src) ? 'you' : /agent|routine|claude/i.test(src) ? 'agent' : '';
function srcChip(from){
  const s = from?.source || 'You', k = kindOf(s), inner = `<i></i>${esc(s)}`;
  return from?.url ? `<a class="src ${k}" href="${esc(from.url)}" target="_blank" rel="noopener">${inner}</a>` : `<span class="src ${k}">${inner}</span>`;
}
// Thread notes as Markdown: headings, lists, quotes, bold, code and links; everything is escaped first.
function md(text){
  const inline = (l) => esc(l)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[\s(])[*_]([^*_\s][^*_]*)[*_](?=[\s.,;:)]|$)/g, '$1<i>$2</i>')
    .replace(/&lt;(https?:\/\/[^\s&]+)&gt;|(https?:\/\/[^\s<]+[^\s<.,;:!?)'"])/g, (_, a, b) => { const u = a || b; return `<a href="${u}" target="_blank" rel="noopener">${u.replace(/^https?:\/\//, '').slice(0, 60)}${u.length > 68 ? '…' : ''}</a>`; });
  const out = []; let list = null, para = [], code = null;
  const flush = () => { if (para.length) out.push(`<p>${para.join('<br>')}</p>`); para = []; if (list) { out.push(`</${list}>`); list = null; } };
  for (const raw of String(text || '').split('\n')) {
    const l = raw.trimEnd();
    let m;
    if (/^\s*```/.test(l)) { if (code) { out.push(`<pre>${esc(code.join('\n'))}</pre>`); code = null; } else { flush(); code = []; } continue; }
    if (code) { code.push(l); continue; }
    if (!l.trim()) { flush(); continue; }
    if ((m = l.match(/^#{1,4}\s+(.*)/))) { flush(); out.push(`<h4>${inline(m[1])}</h4>`); continue; }
    if ((m = l.match(/^>\s?(.*)/))) { flush(); out.push(`<blockquote>${inline(m[1])}</blockquote>`); continue; }
    const ul = l.match(/^\s*[-*•]\s+(.*)/), ol = l.match(/^\s*\d+[.)]\s+(.*)/);
    if (ul || ol) {
      const kind = ul ? 'ul' : 'ol';
      if (para.length) { out.push(`<p>${para.join('<br>')}</p>`); para = []; }
      if (list !== kind) { if (list) out.push(`</${list}>`); out.push(`<${kind}>`); list = kind; }
      out.push(`<li>${inline((ul || ol)[1])}</li>`);
      continue;
    }
    if (list) { out.push(`</${list}>`); list = null; }
    para.push(inline(l));
  }
  if (code) out.push(`<pre>${esc(code.join('\n'))}</pre>`);
  flush();
  return out.join('');
}

// ---------- network: one key per write, reused on every retry, so a lost answer never writes twice ----------
async function api(path, method = 'GET', body){
  const k = method === 'GET' ? null : key();
  for (let attempt = 0; ; attempt++) {
    try {
      const r = await fetch(BASE + path, {method, headers: {'Content-Type': 'application/json', ...(k ? {'Idempotency-Key': k} : {})}, body: body === undefined ? undefined : JSON.stringify(body)});
      if (r.status < 500 && ![408, 425, 429].includes(r.status)) {
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw Object.assign(new Error(data.error || `HTTP ${r.status}`), {final: true, status: r.status, data});
        return data;
      }
    } catch (e) { if (e.final || attempt >= 4) throw e; }
    if (attempt >= 4) throw new Error('The server didn’t answer');
    await new Promise((r) => setTimeout(r, 400 * 2 ** attempt));
  }
}
async function load(){
  const d = await api('api/dashboard');
  const sig = JSON.stringify([d.tasks, d.inbox, d.archived]);
  if (sig === S.sig) return false;
  S.sig = sig; S.tasks = d.tasks; S.inbox = d.inbox; S.archived = d.archived;
  // Fields typed in a doc stay as typed until the server holds them.
  for (const [id, f] of Object.entries(S.tedits)) {
    const t = task(id);
    if (!t) { delete S.tedits[id]; continue; }
    for (const [k, v] of Object.entries(f)) { if (!tsaving[id] && (t[k] ?? '') === v) delete f[k]; else t[k] = v; }
    if (!Object.keys(f).length) delete S.tedits[id];
  }
  if (S.doneOpen) loadArchive();
  render();
  return true;
}
async function loadArchive(){
  try { S.archive = (await api('api/dashboard/archive')).tasks; render(); } catch (e) { toast(`Couldn’t load what’s done: ${e.message}`); }
}
// Applies a change here first, then sends it; on failure says why and reloads what the server holds.
async function write(local, path, method, body, done){
  inflight++;
  if (local) local();
  render();
  try { const r = await api(path, method, body); if (done) done(r); }
  catch (e) { toast(`Not saved: ${e.message}`); }
  finally { inflight--; if (!inflight) load().catch(() => {}); }
}
let idle = 0;
async function poll(){
  if (document.hidden || inflight || Object.keys(tsaving).length) return;
  let changed = false;
  try { changed = await load(); } catch { return; }
  idle = changed ? 0 : idle + 1;
}
// Every 20 s while something changes; backs off to 2 min when nothing has for a while.
(function tick(){ setTimeout(() => { poll().finally(tick); }, idle > 6 ? 120000 : 20000); })();

// ---------- the doc: title and notes saved as you type, one PATCH per pause, one at a time per thread ----------
const tsaving = {}, tTimers = {};
function editTask(id, fields){
  const t = task(id);
  if (!t) return;
  Object.assign(S.tedits[id] ||= {}, fields);
  Object.assign(t, fields);
  clearTimeout(tTimers[id]);
  tTimers[id] = setTimeout(() => sendTask(id), 700);
  setSaveState('Editing');
}
async function sendTask(id){
  clearTimeout(tTimers[id]);
  if (tsaving[id]) { tTimers[id] = setTimeout(() => sendTask(id), 300); return; }
  const body = {...(S.tedits[id] || {})};
  if (!Object.keys(body).length) return;
  tsaving[id] = (tsaving[id] || 0) + 1;
  setSaveState('Saving…');
  try { await api(`api/dashboard/tasks/${id}`, 'PATCH', body); setSaveState('Saved'); }
  catch (e) { toast(`Not saved: ${e.message}`); setSaveState('Not saved'); }
  finally {
    if (!--tsaving[id]) delete tsaving[id];
    const f = S.tedits[id];
    if (f) for (const [k, v] of Object.entries(body)) if (f[k] === v) delete f[k];
    if (f && !Object.keys(f).length) delete S.tedits[id];
    if (!Object.keys(tsaving).length) load().catch(() => {});
  }
}
const flushTask = (id) => { if (id && S.tedits[id]) sendTask(id); };
function setSaveState(s){ for (const el of document.querySelectorAll('[data-savestate]')) el.textContent = s; }
window.addEventListener('beforeunload', (e) => { if (Object.keys(tsaving).length || Object.keys(S.tedits).length) { for (const id of Object.keys(S.tedits)) sendTask(id); e.preventDefault(); } });

// ---------- thread moves ----------
function patch(id, body, local, label){
  const t = task(id);
  if (!t) return;
  if (label) toast(label);
  write(() => local(t), `api/dashboard/tasks/${id}`, 'PATCH', body);
}
function move(id, stage, extra = {}){
  const t = task(id);
  if (!t) return;
  if (stage === 'done' || stage === 'dropped') {
    if (S.open === id) S.open = null;
    if (S.sel === id) S.sel = null;
    return patch(id, {stage, cleared: true}, () => { S.tasks = S.tasks.filter((x) => x.id !== id); S.archived++; S.archive = null; }, stage === 'done' ? 'Done' : 'Dropped');
  }
  if (t.stage === stage && !Object.keys(extra).length) return;
  if (stage === 'thinking') S.open = id;
  if (stage === 'review') { S.sel = id; if (S.open === id) S.open = null; }
  if (stage !== 'todo' && stage !== 'thinking' && t.morningAt) extra = {...extra, morning: false};
  patch(id, {stage, ...extra}, (x) => { x.stage = stage; if (extra.morning === false) x.morningAt = null; if (extra.morning === true) x.morningAt ||= Date.now(); x.updatedAt = Date.now(); }, stage === 'thinking' ? null : `→ ${STAGE_NAME[stage]}`);
}
function pickMorning(id, on){
  const t = task(id);
  if (!t) return;
  patch(id, {morning: on, ...(on && t.stage === 'backlog' ? {stage: 'todo'} : {})}, (x) => { x.morningAt = on ? (x.morningAt || Date.now()) : null; if (on && x.stage === 'backlog') x.stage = 'todo'; }, on ? 'Tomorrow morning' : 'Not tomorrow');
}
function restore(id){
  write(() => { if (S.archive) S.archive = S.archive.filter((x) => x.id !== id); S.archived = Math.max(0, S.archived - 1); toast('Back in the backlog'); }, `api/dashboard/tasks/${id}`, 'PATCH', {cleared: false, stage: 'backlog'});
}
function newThread(title, area, extra = {}, then){
  const id = `t_${key().replace(/-/g, '').slice(0, 16)}`, at = Date.now();
  write(() => { S.tasks.push({id, title, body: '', stage: 'backlog', morningAt: null, state: 'you', waitingOn: null, parent: null, links: extra.links || [], prompt: null, createdFrom: {source: 'You'}, createdAt: at, updatedAt: at, pinnedAt: null, clearedAt: null, area, updates: []}); if (then) then(id); },
    'api/dashboard/tasks', 'POST', {id, title, area, stage: 'backlog', ...extra});
  return id;
}
function addLink(id, url){
  const t = task(id);
  let u; try { u = new URL(url); } catch { return toast('Paste a full link'); }
  const host = u.hostname.replace(/^www\./, '');
  const kind = /github\.com$/.test(host) ? 'github' : /linear\.app$/.test(host) ? 'linear' : /slack\.com$/.test(host) ? 'slack' : /notion\.(so|site|com)$/.test(host) ? 'notion' : /claude\.ai$/.test(host) ? 'claude' : 'web';
  const parts = u.pathname.split('/').filter(Boolean);
  const ref = kind === 'github' && parts.length >= 4 ? `${parts[0]}/${parts[1]}#${parts[3]}` : parts.length ? parts[parts.length - 1].slice(0, 80) : host;
  const links = [...t.links, {kind, ref, url: u.href}];
  patch(id, {links}, (x) => { x.links = links; }, 'Link added');
}
function removeLink(id, i){
  const t = task(id), links = t.links.filter((_, n) => n !== i);
  patch(id, {links}, (x) => { x.links = links; });
}
function copyDoc(id){
  const t = task(id), text = `${t.title}\n\n${t.body || ''}`.trim();
  const done = () => toast('Copied for Claude');
  try { navigator.clipboard.writeText(text).then(done, () => { prompt('Copy this', text); }); } catch { prompt('Copy this', text); }
}

// ---------- inbox ----------
function keep(id, stage){
  const p = S.inbox.find((x) => x.id === id);
  if (!p) return;
  S.cur = nextAfter(id);
  write(() => { S.inbox = S.inbox.filter((x) => x.id !== id); toast(stage === 'todo' ? '→ To-do' : '→ Backlog'); }, `api/dashboard/inbox/${id}/keep`, 'POST', {stage, area: p.area});
}
function dropItem(id){
  S.cur = nextAfter(id);
  write(() => { S.inbox = S.inbox.filter((x) => x.id !== id); toast('Dropped'); }, `api/dashboard/inbox/${id}/drop`, 'POST', {});
}
function setItemArea(id, area){
  write(() => { const p = S.inbox.find((x) => x.id === id); if (p) p.area = area; }, `api/dashboard/inbox/${id}`, 'PATCH', {area});
}
const inboxRows = () => S.inbox.filter((p) => (p.area || 'work') === S.area);
function nextAfter(id){ const rows = inboxRows(), i = rows.findIndex((p) => p.id === id); return rows[i + 1]?.id || rows[i - 1]?.id || null; }

// ---------- views ----------
const byMorning = (a, b) => (b.morningAt ? 1 : 0) - (a.morningAt ? 1 : 0) || (a.morningAt || 0) - (b.morningAt || 0) || b.createdAt - a.createdAt;
const mine = (stage) => S.tasks.filter((t) => t.stage === stage && t.area === S.area && !t.parent);
const picks = () => S.tasks.filter((t) => t.stage === 'todo' && t.morningAt).sort((a, b) => a.morningAt - b.morningAt);

function rowActs(t){
  const tmrw = t.morningAt ? `<button class="btn ghost sm" data-morning="${t.id}|0" aria-label="Not tomorrow morning">Not tomorrow</button>` : `<button class="btn ghost sm" data-morning="${t.id}|1" aria-label="Tomorrow morning">Tomorrow</button>`;
  const fwd = t.stage === 'backlog' ? `<button class="btn ghost sm" data-move="${t.id}|todo">→ To-do</button>` : `<button class="btn ghost sm" data-move="${t.id}|thinking">→ Thinking</button><button class="btn ghost sm" data-move="${t.id}|backlog">← Backlog</button>`;
  return `<span class="acts">${fwd}${tmrw}<button class="btn ghost sm" data-move="${t.id}|dropped">Drop</button></span>`;
}
function row(t){
  return `<div class="r${t.morningAt ? ' pick' : ''}${Date.now() - t.updatedAt > OLD ? ' dim' : ''}" draggable="true" data-id="${t.id}">
    <button class="t" data-sheet="${t.id}" title="${esc(t.title)}">${esc(t.title)}</button>${srcChip(t.createdFrom)}${rowActs(t)}<span class="d">${age(t.createdAt)}</span></div>`;
}
function inboxRow(p){
  const cur = p.id === S.cur;
  const title = p.kind === 'update' ? `Notes for “${esc(task(p.task)?.title || p.task)}”` : esc(p.title);
  const line = p.kind === 'update' ? esc(p.text || '') : esc(p.context || (p.body && !/^## /.test(p.body) ? p.body.split('\n')[0] : '') || '');
  return `<div class="ir" role="button" tabindex="0" aria-current="${cur}" data-cur="${p.id}">
    <div class="t">${title}</div>
    ${line ? `<div class="c">${line}</div>` : ''}
    ${p.from?.quote ? `<div class="q">“${esc(p.from.quote)}”</div>` : ''}
    <div class="k">${srcChip(p.from)}<span class="faint xs">${age(p.at)}</span>
      ${cur ? `<span class="acts"><span class="areaseg" role="group" aria-label="Work or personal"><button aria-selected="${p.area !== 'personal'}" data-itemarea="${p.id}|work">Work</button><button aria-selected="${p.area === 'personal'}" data-itemarea="${p.id}|personal">Personal</button></span><button class="btn sm" data-keep="${p.id}|backlog">→ Backlog</button><button class="btn sm" data-keep="${p.id}|todo">→ To-do</button><button class="btn sm ghost" data-dropitem="${p.id}">Drop</button></span>` : ''}
    </div></div>`;
}
function routinePanel(){
  const r = S.routine;
  if (!r) return '';
  const cooling = r.ranAt && Date.now() - r.ranAt < 60000;
  const last = r.ranAt ? `Last run ${hm(r.ranAt)}${r.sessionUrl ? ` · <a href="${esc(r.sessionUrl)}" target="_blank" rel="noopener">open</a>` : ''}` : 'Not run yet';
  const head = r.connected
    ? `<span class="rrow"><button class="btn sm" data-runnow ${S.running || cooling ? 'disabled' : ''}>${S.running ? 'Starting…' : 'Run the routine now'}</button><span>${last}</span><button class="btn ghost sm" data-routineform>Change</button></span>${r.error ? `<span class="err">${esc(r.error)}</span>` : ''}`
    : `<span class="rrow"><span>Connect the scheduled routine to run it from here.</span><button class="btn ghost sm" data-routineform>Connect</button></span>`;
  const form = S.routineForm ? `<form id="routineForm" class="routine" autocomplete="off">
      <label class="routine">Fire URL<input id="routineUrl" placeholder="https://api.anthropic.com/v1/claude_code/routines/trig_…/fire" value="${esc(r.url || '')}"></label>
      <label class="routine">API token<input id="routineToken" type="password" placeholder="Shown once when you generate it"></label>
      <span class="rrow"><button class="btn sm" type="submit">Save</button>${r.connected ? '<button class="btn ghost sm" type="button" data-routineoff>Disconnect</button>' : ''}<button class="btn ghost sm" type="button" data-routineform>Cancel</button></span>
    </form>` : '';
  return `<div class="routine">${head}${form}</div>`;
}
function triageView(){
  const rows = inboxRows();
  if (S.sub === 'inbox' && (!S.cur || !rows.some((p) => p.id === S.cur))) S.cur = rows[0]?.id || null;
  const backlog = mine('backlog').sort((a, b) => b.createdAt - a.createdAt), todo = mine('todo').sort(byMorning);
  const fresh = backlog.filter((t) => Date.now() - t.createdAt <= OLD), old = backlog.filter((t) => Date.now() - t.createdAt > OLD);
  const counts = {inbox: rows.length, backlog: backlog.length, todo: todo.length};
  const tabs = [['inbox', 'Inbox'], ['backlog', 'Backlog'], ['todo', 'To-do']].map(([k, n]) => `<button class="st" role="tab" aria-selected="${S.sub === k}" data-sub="${k}" data-drop="${k}">${n} <span class="n">${counts[k] || ''}</span></button>`).join('');
  let list;
  if (S.sub === 'inbox') list = `${rows.map(inboxRow).join('') || '<p class="empty">Nothing new.</p>'}${routinePanel()}`;
  else if (S.sub === 'backlog') list = `<form class="add" id="addForm"><label class="sr" for="addIn">New thread</label><input id="addIn" data-keep-focus="addIn" placeholder="New thread…" autocomplete="off"><button class="btn" type="submit">Add</button></form>
    <div class="list">${fresh.map(row).join('')}${old.length ? (S.unfold ? old.map(row).join('') : `<button class="fold" data-unfold><span class="chev">▸</span>${old.length} more, older than two weeks</button>`) : ''}${backlog.length ? '' : '<p class="empty">The backlog is empty.</p>'}</div>`;
  else list = `<div class="list">${todo.map(row).join('') || '<p class="empty">Nothing in to-do. Drag threads here from the backlog.</p>'}</div>`;
  const ps = picks();
  return `<div class="triage">
    <section class="list-col">
      <div class="subbar" role="tablist" aria-label="Triage">${tabs}<span class="spacer"></span><span class="areaseg" role="tablist" aria-label="Work or personal"><button role="tab" aria-selected="${S.area === 'work'}" data-area="work">Work</button><button role="tab" aria-selected="${S.area === 'personal'}" data-area="personal">Personal</button></span></div>
      ${list}
    </section>
    <aside class="tmrw">
      <h1>Tomorrow morning <span class="n">${ps.length || ''}</span></h1>
      <div class="box" data-drop="morning">
        ${ps.map((t) => `<div class="slot" draggable="true" data-id="${t.id}"><button class="t" data-sheet="${t.id}">${esc(t.title)}</button><div class="k">${srcChip(t.createdFrom)}${t.area !== S.area ? `<span class="area-chip">${t.area}</span>` : ''}</div><button class="x" data-morning="${t.id}|0" aria-label="Not tomorrow morning">×</button></div>`).join('')}
        <div class="slot empty">Drag a thread here</div>
      </div>
      <div class="hint">These open first in Thinking. A nudge, not a rule: drag anything into Thinking whenever you like.</div>
    </aside>
  </div>`;
}
function docView(t, where){
  const f = S.tedits[t.id] || {};
  const title = f.title ?? t.title, body = f.body ?? t.body;
  const foot = where === 'thinking'
    ? `<button class="btn dark" data-move="${t.id}|review">→ Review</button><button class="btn" data-copy="${t.id}">Copy for Claude</button><button class="btn ghost" data-close>Close for now</button>`
    : `<button class="btn" data-copy="${t.id}">Copy for Claude</button>${t.stage !== 'thinking' && !ENDED(t) ? `<button class="btn ghost" data-move="${t.id}|thinking">→ Thinking</button>` : ''}<button class="btn ghost" data-close>Close</button>`;
  const editing = S.editing === t.id;
  return `<article class="doc${editing ? ' editing' : ''}" data-doc="${t.id}">
    <div class="crumb">${srcChip(t.createdFrom)}<span>·</span><span>${STAGE_NAME[t.stage] || t.stage}</span>${t.area === 'personal' ? '<span>·</span><span>personal</span>' : ''}<span class="spacer"></span>${t.links.map((l) => `<a href="${esc(l.url || '#')}" target="_blank" rel="noopener">${esc(l.ref)}</a>`).join('')}</div>
    <label class="sr" for="dtitle-${t.id}">Title</label>
    <textarea class="dtitle" id="dtitle-${t.id}" data-tf="title" data-keep-focus="title" rows="1" placeholder="Untitled">${esc(title)}</textarea>
    <label class="sr" for="dbody-${t.id}">Notes</label>
    <div class="preview" data-edit="${t.id}">${body.trim() ? md(body) : '<p class="ph">Write until you could hand it to Claude without being in the room.</p>'}</div>
    <textarea class="dbody" id="dbody-${t.id}" data-tf="body" data-keep-focus="body" aria-label="Notes">${esc(body)}</textarea>
    <div class="foot">${foot}<span class="state" data-savestate>${S.tedits[t.id] ? 'Editing' : ''}</span></div>
  </article>`;
}
function thinkingView(){
  const open = S.tasks.filter((t) => t.stage === 'thinking').sort((a, b) => b.updatedAt - a.updatedAt);
  if (S.open && !open.some((t) => t.id === S.open)) S.open = null;
  if (!S.open && open.length) S.open = open[0].id;
  const ps = picks().filter((t) => t.stage === 'todo'), rest = S.tasks.filter((t) => t.stage === 'todo' && !t.morningAt).sort((a, b) => b.updatedAt - a.updatedAt);
  const rail = [
    ...open.map((t) => `<button class="thread ${t.id === S.open ? 'open' : 'closed'}" data-openthread="${t.id}">${esc(t.title)}</button>`),
    ...(open.length && (ps.length || rest.length) ? ['<div class="sec"></div>'] : []),
    ...ps.map((t) => `<button class="thread closed" data-move="${t.id}|thinking" title="Open in Thinking">${esc(t.title)}</button>`),
    ...(ps.length && rest.length ? ['<div class="sec"></div>'] : []),
    ...rest.map((t) => `<button class="thread todo" data-move="${t.id}|thinking" title="Open in Thinking">${esc(t.title)}</button>`),
  ].join('') || '<p class="none">Nothing to think about. Pick threads in Triage.</p>';
  const t = S.open && task(S.open);
  return `<div class="think"><aside class="rail">${rail}</aside>${t ? docView(t, 'thinking') : `<article class="doc blank"><div>${open.length || ps.length || rest.length ? 'Pick a thread from the left.' : 'Nothing in Thinking yet.<br>Pick threads in Triage, or drag one onto this tab.'}</div></article>`}</div>`;
}
function artIcon(l){ return `<span class="ic ${l.kind}">${l.kind === 'github' ? 'PR' : l.kind === 'linear' ? 'LN' : l.kind === 'slack' ? 'SL' : l.kind === 'web' ? 'WEB' : esc(l.kind.slice(0, 3))}</span>`; }
function reviewView(){
  const list = S.tasks.filter((t) => t.stage === 'review').sort((a, b) => b.updatedAt - a.updatedAt);
  if (S.sel && !list.some((t) => t.id === S.sel)) S.sel = null;
  if (!S.sel && list.length) S.sel = list[0].id;
  const t = S.sel && task(S.sel);
  const ended = S.tasks.filter(ENDED);
  const done = S.doneOpen ? [...ended, ...(S.archive || [])].sort((a, b) => b.updatedAt - a.updatedAt).slice(0, 40) : [];
  const panel = t ? `<section class="rpanel">
      <div class="from">${srcChip(t.createdFrom)}${t.area === 'personal' ? '<span class="area-chip">personal</span>' : ''}<span class="spacer"></span><button class="btn ghost sm" data-sheet="${t.id}">Your notes ↗</button></div>
      <h2>${esc(t.title)}</h2>
      <div class="arts">${t.links.map((l, i) => `<div class="art">${artIcon(l)}<div class="am"><div class="at">${esc(l.ref)}${l.title ? ` · ${esc(l.title)}` : ''}</div><div class="ad">${esc(l.url ? l.url.replace(/^https?:\/\//, '') : l.kind)}</div></div>${l.url ? `<a class="go" href="${esc(l.url)}" target="_blank" rel="noopener">Open ↗</a>` : ''}<button class="btn ghost sm" data-unlink="${t.id}|${i}" aria-label="Remove link">×</button></div>`).join('')}
        <form class="addlink" id="linkForm" data-task="${t.id}"><label class="sr" for="linkIn">Add a link</label><input id="linkIn" data-keep-focus="linkIn" placeholder="Paste a PR, explainer or test run link…" autocomplete="off"><button class="btn" type="submit">Add</button></form></div>
      ${t.body.trim() ? `<details class="fold2"><summary>Your notes</summary><div class="notes">${md(t.body)}</div></details>` : ''}
      <div class="ractions"><button class="btn primary" data-move="${t.id}|done">Done</button><button class="btn" data-followup="${t.id}">New thread from this…</button><button class="btn ghost r2" data-move="${t.id}|dropped">Drop</button></div>
    </section>` : `<section class="rpanel blank">${list.length ? 'Pick a thread.' : 'Nothing to review. Drag a thread onto this tab when Claude is done with it.'}</section>`;
  return `<div class="review">
    <nav class="rlist">
      <h1>Ready for you <span class="n">${list.length || ''}</span></h1>
      <div>${list.map((x) => `<button class="rrow" aria-current="${x.id === S.sel}" data-sel="${x.id}"><div class="t">${esc(x.title)}</div><div class="k">${srcChip(x.createdFrom)}<span>since ${hm(x.updatedAt)}</span>${x.area === 'personal' ? '<span class="area-chip">personal</span>' : ''}</div></button>`).join('') || '<p class="empty">Nothing waiting.</p>'}</div>
      <button class="fold" data-done><span class="chev">${S.doneOpen ? '▾' : '▸'}</span>Done${S.archived + ended.length ? ` · ${S.archived + ended.length}` : ''}</button>
      ${S.doneOpen ? `<div class="list">${done.map((x) => `<div class="arow"><span class="at">${esc(x.title)}</span><span class="xs faint">${x.stage === 'dropped' ? 'dropped' : 'done'}</span><button class="btn ghost sm" data-restore="${x.id}">Back</button></div>`).join('') || '<p class="empty">Nothing yet.</p>'}</div>` : ''}
    </nav>
    ${panel}
  </div>`;
}

// Where the hour puts you: thinking before 11, review from 13 to 16, triage otherwise. Every tab works at every hour.
function hourMode(){ const h = new Date().getHours(); return h < 11 ? 'thinking' : h >= 13 && h < 16 ? 'review' : 'triage'; }
function clockLine(){
  const h = new Date().getHours();
  if (h < 11) return 'Thinking until 11:00';
  if (h < 13) return 'Review opens 13:00';
  if (h < 16) return 'Review until 16:00';
  return 'Thinking opens tomorrow morning';
}
function tickClock(){
  const d = new Date();
  document.getElementById('clockTime').textContent = `${hm(d)} · ${d.toLocaleDateString([], {weekday: 'long'})}`;
  document.getElementById('clockLine').textContent = clockLine();
}
tickClock(); setInterval(tickClock, 30000);

function renderSheet(){
  const t = S.sheet && task(S.sheet);
  document.body.classList.toggle('sheet-open', !!t);
  document.getElementById('sheet').innerHTML = t ? docView(t, 'sheet') : '';
}
function render(){
  document.body.dataset.mode = S.mode;
  document.querySelectorAll('.m[data-mode]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.mode === S.mode)));
  document.getElementById('thinkN').textContent = String(S.tasks.filter((t) => t.stage === 'thinking' || (t.stage === 'todo' && t.morningAt)).length || '');
  document.getElementById('reviewN').textContent = String(S.tasks.filter((t) => t.stage === 'review').length || '');
  // Something arrived while you were elsewhere: a count on Triage, nothing more.
  const badge = document.getElementById('triageBadge');
  badge.hidden = S.mode === 'triage' || !S.inbox.length;
  badge.textContent = String(S.inbox.length);
  // innerHTML replaces the fields, so the one being typed in is found again and refocused.
  const a = document.activeElement, fk = a?.dataset?.keepFocus;
  const caret = fk && 'selectionStart' in a ? [a.selectionStart, a.selectionEnd, a.value, a.scrollTop] : null;
  const view = document.getElementById('view');
  view.innerHTML = S.mode === 'thinking' ? thinkingView() : S.mode === 'review' ? reviewView() : triageView();
  renderSheet();
  if (fk) {
    const el = document.querySelector(`[data-keep-focus="${fk}"]`);
    if (el) { if (caret && el.value !== caret[2] && (fk === 'addIn' || fk === 'linkIn')) el.value = caret[2]; el.focus(); if (caret) { try { el.setSelectionRange(caret[0], caret[1]); } catch {} el.scrollTop = caret[3]; } }
  }
  for (const ta of document.querySelectorAll('.dtitle')) fit(ta);
}
function fit(ta){ ta.style.height = 'auto'; ta.style.height = `${ta.scrollHeight}px`; }
function setMode(m){ S.mode = m; session.set('focus-mode', m); S.sheet = null; render(); }

// ---------- events ----------
document.addEventListener('dragstart', (e) => {
  const el = e.target.closest?.('[draggable="true"]');
  if (!el) return;
  dragId = el.dataset.id;
  el.classList.add('dragging');
  try { e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.effectAllowed = 'move'; } catch {}
});
document.addEventListener('dragend', (e) => { e.target.classList?.remove('dragging'); document.querySelectorAll('.over').forEach((z) => z.classList.remove('over')); });
document.addEventListener('dragover', (e) => {
  const z = e.target.closest?.('[data-drop]');
  if (!z || !dragId) return;
  e.preventDefault();
  document.querySelectorAll('.over').forEach((o) => { if (o !== z) o.classList.remove('over'); });
  z.classList.add('over');
});
document.addEventListener('drop', (e) => {
  const z = e.target.closest?.('[data-drop]');
  if (!z || !dragId) return;
  e.preventDefault();
  const id = dragId; dragId = null;
  document.querySelectorAll('.over').forEach((o) => o.classList.remove('over'));
  const to = z.dataset.drop;
  if (to === 'morning') return pickMorning(id, true);
  if (to === 'inbox' || to === 'triage') return;
  move(id, to);
});
// The notes read as a page until you click into them; leaving them shows the page again.
document.addEventListener('click', (e) => {
  const pv = e.target.closest('[data-edit]');
  if (pv && !e.target.closest('a') && !getSelection().toString()) {
    S.editing = pv.dataset.edit;
    const doc = pv.closest('.doc'); doc.classList.add('editing');
    const ta = doc.querySelector('.dbody'); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
    return;
  }
  const t = e.target.closest('button, [data-cur], #sheetBg');
  if (!t) return;
  if (t.type === 'submit' && t.form) return;
  const d = t.dataset;
  if (t.id === 'sheetBg' || t.hasAttribute('data-close')) { flushTask(S.sheet); if (S.sheet) { S.sheet = null; return render(); } if (S.mode === 'thinking') { flushTask(S.open); S.open = null; return render(); } return; }
  if (d.mode) return setMode(d.mode);
  if (d.sub) { S.sub = d.sub; session.set('focus-sub', d.sub); return render(); }
  if (d.area) { S.area = d.area; storage.set('dashboard-area', d.area); return render(); }
  if (d.sheet) { flushTask(S.sheet); S.sheet = d.sheet; return render(); }
  if (d.openthread) { flushTask(S.open); S.open = d.openthread; return render(); }
  if (d.move) { const [id, s] = d.move.split('|'); flushTask(id); if (s === 'thinking' && S.mode !== 'thinking') { S.sheet = null; } return move(id, s); }
  if (d.morning) { const [id, on] = d.morning.split('|'); return pickMorning(id, on === '1'); }
  if (d.keep) { const [id, s] = d.keep.split('|'); return keep(id, s); }
  if (d.dropitem) return dropItem(d.dropitem);
  if (d.itemarea) { const [id, a] = d.itemarea.split('|'); return setItemArea(id, a); }
  if (d.cur !== undefined && !e.target.closest('a, button')) { S.cur = d.cur; return render(); }
  if (d.sel) { S.sel = d.sel; return render(); }
  if (d.copy) return copyDoc(d.copy);
  if (d.unlink) { const [id, i] = d.unlink.split('|'); return removeLink(id, Number(i)); }
  if (d.followup) { const from = task(d.followup); if (!from) return; const id = newThread(`Follow-up: ${from.title}`, from.area, {links: [{kind: 'strata', ref: from.id, title: from.title}]}); S.sheet = id; return; }
  if (d.restore) return restore(d.restore);
  if (t.hasAttribute('data-unfold')) { S.unfold = true; return render(); }
  if (t.hasAttribute('data-done')) { S.doneOpen = !S.doneOpen; if (S.doneOpen && !S.archive) loadArchive(); return render(); }
  if (t.hasAttribute('data-runnow')) return runNow();
  if (t.hasAttribute('data-routineform')) { S.routineForm = !S.routineForm; return render(); }
  if (t.hasAttribute('data-routineoff')) return saveRoutine({url: null});
});
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset?.tf) {
    const id = el.closest('[data-doc]')?.dataset.doc;
    if (!id) return;
    if (el.classList.contains('dtitle')) fit(el);
    return editTask(id, {[el.dataset.tf]: el.dataset.tf === 'title' ? el.value.replace(/\n/g, ' ') : el.value});
  }
});
document.addEventListener('submit', (e) => {
  e.preventDefault();
  if (e.target.id === 'addForm') {
    const input = document.getElementById('addIn'), title = input.value.trim();
    if (!title) return;
    input.value = '';
    return newThread(title, S.area);
  }
  if (e.target.id === 'linkForm') {
    const input = document.getElementById('linkIn'), url = input.value.trim();
    if (!url) return;
    input.value = '';
    return addLink(e.target.dataset.task, url);
  }
  if (e.target.id === 'routineForm') return saveRoutine({url: document.getElementById('routineUrl').value.trim(), token: document.getElementById('routineToken').value.trim()});
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.classList?.contains('dtitle')) { e.preventDefault(); e.target.closest('.doc')?.querySelector('.dbody')?.focus(); return; }
  if (e.key === 'Escape' && S.sheet) { flushTask(S.sheet); S.sheet = null; return render(); }
  if (e.target.matches?.('input, textarea, select') || e.target.isContentEditable || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === '1' || k === '2' || k === '3') { e.preventDefault(); return setMode(MODES[Number(k) - 1]); }
  if (S.mode === 'triage' && S.sub === 'inbox' && S.cur) {
    if (k === 'b') { e.preventDefault(); return keep(S.cur, 'backlog'); }
    if (k === 't') { e.preventDefault(); return keep(S.cur, 'todo'); }
    if (k === 'x') { e.preventDefault(); return dropItem(S.cur); }
    if (k === 'j' || k === 'k') { const rows = inboxRows(), i = rows.findIndex((p) => p.id === S.cur); const n = rows[i + (k === 'j' ? 1 : -1)]; if (n) { S.cur = n.id; render(); } return; }
  }
  if (e.key === 'Enter' && e.target.dataset?.cur) { S.cur = e.target.dataset.cur; render(); }
});
document.addEventListener('focusout', (e) => {
  if (e.target.classList?.contains('dbody') && S.editing) { S.editing = null; setTimeout(() => { if (!document.activeElement?.classList?.contains('dbody')) render(); }, 0); }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) { idle = 0; poll(); } });

async function saveRoutine(body){
  try { S.routine = await api('api/dashboard/routine', 'PUT', body); S.routineForm = false; toast(S.routine.connected ? 'Routine connected.' : 'Routine disconnected.'); }
  catch (e) { toast(`Not saved: ${e.message}`); }
  render();
}
async function runNow(){
  S.running = true; render();
  try {
    S.routine = await api('api/dashboard/routine/run', 'POST', {});
    toast(S.routine.error ? 'The routine didn’t start.' : 'The routine is running.');
    setTimeout(render, 61000);
  } catch (e) { toast(`Didn’t run: ${e.message}`); }
  S.running = false; render();
}

document.getElementById('strataLink').href = BASE;
S.area = storage.get('dashboard-area', 'work') === 'personal' ? 'personal' : 'work';
S.mode = MODES.includes(session.get('focus-mode', null)) ? session.get('focus-mode', null) : hourMode();
S.sub = ['inbox', 'backlog', 'todo'].includes(session.get('focus-sub', null)) ? session.get('focus-sub', null) : 'backlog';
render();
load().catch((e) => { document.getElementById('view').innerHTML = `<p class="muted">Couldn’t load: ${esc(e.message)}</p>`; });
api('api/dashboard/routine').then((r) => { S.routine = r; render(); }, () => {});
</script>
</body>
</html>
